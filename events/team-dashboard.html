<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Team Dashboard</title>

  <link rel="stylesheet" href="../app.css" />
  <link rel="stylesheet" href="./team-dashboard.css" />
  <link rel="icon" href="data:," />
</head>

<body>

  <main class="app-shell">

    <section class="hero">
      <p class="eyebrow">CornermanAI</p>

      <h1>Team Dashboard</h1>

      <p class="sub">
        Team performance, scoring trends, and event analytics.
      </p>
    </section>

    <section class="stats-grid">

      <article class="stat-card">
        <span>Record</span>
        <strong id="record">0-0</strong>
      </article>

      <article class="stat-card">
        <span>Win %</span>
        <strong id="winPct">0%</strong>
      </article>

      <article class="stat-card">
        <span>Points For</span>
        <strong id="pointsFor">0</strong>
      </article>

      <article class="stat-card">
        <span>Points Against</span>
        <strong id="pointsAgainst">0</strong>
      </article>

      <article class="stat-card">
        <span>Pins</span>
        <strong id="pins">0</strong>
      </article>

      <article class="stat-card">
        <span>Techs</span>
        <strong id="techs">0</strong>
      </article>

      <article class="stat-card">
        <span>Majors</span>
        <strong id="majors">0</strong>
      </article>

      <article class="stat-card">
        <span>Decisions</span>
        <strong id="decisions">0</strong>
      </article>

    </section>

    <section class="card">
      <span>RECENT MATCHES</span>

      <div id="recentMatches">
        Loading...
      </div>
    </section>

    <section class="grid">

      <a class="card" href="../console/">
        <span>BACK</span>
        <strong>Console Command Center</strong>
        <p>Return to the command center.</p>
      </a>

    </section>

  </main>

  <script src="./team-dashboard.js"></script>

</body>
</html>
