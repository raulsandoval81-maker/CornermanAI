<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Media Library</title>

  <link
    rel="stylesheet"
    href="./media.css"
  />
</head>

<body>

  <main class="page">

    <section class="hero">
      <p class="eyebrow">
        MEDIA
      </p>

      <h1>
        Media Library
      </h1>

      <p class="sub">
        Organize uploaded match videos, linked matches, and future media assets.
      </p>
    </section>

    <section class="card">
      <span>
        SEARCH
      </span>

      <strong>
        Media Filters
      </strong>

      <div class="form-stack">
        <input
          id="mediaSearch"
          type="text"
          placeholder="Search athlete, opponent, event, title, URL, or match ID"
        />

        <select id="mediaEventFilter">
          <option value="">
            All Events
          </option>
        </select>

        <select id="mediaStatusFilter">
          <option value="all">
            All Media
          </option>

          <option value="linked">
            Linked
          </option>

          <option value="unlinked">
            Unlinked
          </option>
        </select>
      </div>
    </section>

    <section class="card">
      <span>
        SUMMARY
      </span>

      <strong>
        Media Snapshot
      </strong>

      <div id="mediaStats"></div>
    </section>

    <section class="card">
      <span>
        LIBRARY
      </span>

      <strong>
        Uploaded Media
      </strong>

      <div id="mediaList"></div>
    </section>

    <section class="card">
      <span>
        BACK
      </span>

      <a href="../console/">
        Console Command Center
      </a>
    </section>

  </main>

  <script
    type="module"
    src="./media-index.js"
  ></script>

</body>
</html>
