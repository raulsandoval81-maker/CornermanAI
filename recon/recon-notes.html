<section class="card">

<h2>Opponent Profile</h2>

<label>Opponent</label>
<input id="opponentName">

<label>Team</label>
<input id="opponentTeam">

<label>Weight Class</label>
<input id="weightClass">

<label>Preferred Stance</label>
<input id="preferredStance">

<label>Favorite Tie</label>
<input id="favoriteTie">

<label>Favorite Shot</label>
<input id="favoriteShot">

<label>Favorite Finish</label>
<input id="favoriteFinish">

<label>Favorite Escape</label>
<input id="favoriteEscape">

<label>Best Turn</label>
<input id="bestTurn">

<label>Scores First?</label>
<select id="scoresFirst">
  <option>Unknown</option>
  <option>Usually</option>
  <option>Sometimes</option>
  <option>Rarely</option>
</select>

<label>Match Pace</label>
<select id="matchPace">
  <option>Slow</option>
  <option>Average</option>
  <option>Fast</option>
</select>

<label>Conditioning</label>
<select id="conditioning">
  <option>Unknown</option>
  <option>Strong</option>
  <option>Average</option>
  <option>Fades Late</option>
</select>

<label>Coach Notes</label>
<textarea id="coachNotes"></textarea>

<button id="saveRecon">
Save Recon
</button>

</section>
