<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recon Notes</title>
  <link rel="stylesheet" href="../app.css">
</head>
<body>

<main class="app-shell">

  <section class="card">
    <span>RECON</span>
    <strong>Opponent Notes</strong>
    <p>
      Capture tendencies and observations.
    </p>
  </section>

  <section class="card">


<label>Opponent</label>
<input
  id="opponentName"
  type="text"
  placeholder="Opponent Name"
>
<label>Preferred Stance</label>

<input
  id="preferredStance"
  type="text"
  placeholder="Right Lead"
/>


<label>Favorite Tie</label>
<input
  id="favoriteTie"
  type="text"
  placeholder="Collar Tie"
>

<label>Favorite Shot</label>
<input
  id="favoriteShot"
  type="text"
  placeholder="Sweep Single"
>

<label>Favorite Escape</label>
<input
  id="favoriteEscape"
  type="text"
  placeholder="Stand Up"
>

<label>Best Turn</label>
<input
  id="bestTurn"
  type="text"
  placeholder="Half Nelson"
>

<label>Coach Notes</label>
<textarea
  id="coachNotes"
  rows="6"
  placeholder="Additional observations..."
></textarea>

<button id="saveRecon">
  Save Recon
</button>


  </section>

  <section class="card">
    <span>SAVED NOTES</span>
    <div id="reconList">
      No notes saved.
    </div>
  </section>

</main>

<script src="./recon-notes.js"></script>

</body>
</html>
