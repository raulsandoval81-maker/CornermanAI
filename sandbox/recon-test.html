<!doctype html>
<html>
<body>

<pre id="output"></pre>

<script type="module">
import { runRecon } from "../recon/recon-runner.js";

const response =
  await fetch("../payloads/sample-match.json");

const matchPayload =
  await response.json();

const result =
  runRecon(matchPayload);

document.getElementById("output").textContent =
  JSON.stringify(result, null, 2);
</script>

</body>
</html>
