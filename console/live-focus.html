<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Coach Console · Focus</title>

  <link rel="stylesheet" href="./classic-console.css" />
  <link rel="stylesheet" href="./compact-console.css" />
  <link rel="stylesheet" href="./landscape-action.css" />
  <link rel="stylesheet" href="./live-focus.css" />
  <link rel="stylesheet" href="../shared/cornerman-shell.css" />
  <link rel="icon" href="data:," />
</head>

<body data-console="compact" class="focus-console">

<main class="wrap">

  <header class="topbar">

    <div class="mode-switch">
      <button id="liveMode" class="mode active" type="button">LIVE</button>
      <button id="reviewMode" class="mode" type="button">REVIEW</button>
    </div>

    <div class="header-format">
      <select id="matchFormat">
        <option value="">Match Format</option>
      </select>
    </div>

    <button id="toggleMatchActions" class="top-tools-btn" type="button" aria-haspopup="dialog" aria-expanded="false">⋯ Tools</button>

  </header>

  <div id="status" class="status-line">
    Live mode
  </div>

  </section>

  <section class="match-card round-flow-card">

    <div id="chooserPanel" class="choice-panel hidden">
      <strong>WHO HAS CHOICE?</strong>
      <button id="greenChooserBtn" type="button">GREEN</button>
      <button id="redChooserBtn" type="button">RED</button>
    </div>

    <div id="choicePanel" class="choice-panel hidden">
      <strong id="choiceOwnerLabel">CHOICE</strong>
      <button type="button" data-choice="top">Top</button>
      <button type="button" data-choice="bottom">Bottom</button>
      <button type="button" data-choice="neutral">Neutral</button>
      <button type="button" data-choice="defer">Defer</button>
    </div>

  </section>

  <section class="arena-card">

    <div class="focus-camera-toolbar">
      <div class="focus-division">
        <span id="eventNameDisplay" class="compact-event-context">Event: —</span>
        <span id="weightGroupDisplay">Division: —</span>
        <span id="weightClassDisplay">Weight: —</span>
      </div>
